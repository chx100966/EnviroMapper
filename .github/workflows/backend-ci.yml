name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore backend/EnviroMapper.sln

      - name: Build
        run: dotnet build backend/EnviroMapper.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/EnviroMapper.sln --no-build --configuration Release
