[project]
name = "enviromapper-ai"
version = "0.1.0" # stamped by .github/scripts/version.py
description = "EnviroMapper AI module: IoT device simulator (the analytics models come later)"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
